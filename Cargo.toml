[workspace]
resolver = "2"
members = ["crates/quantum-hd8", "crates/mackie-control"]

[workspace.package]
edition = "2021"
version = "0.3.0"
rust-version = "1.94"
license = "MIT"
repository = "https://github.com/xgodev/mackie-control"

[workspace.dependencies]
quantum-hd8 = { path = "crates/quantum-hd8" }
pedal-core = { git = "ssh://git@github.com/xgodev/pedal-drivers.git", branch = "main" }
mvave-mk300 = { git = "ssh://git@github.com/xgodev/pedal-drivers.git", branch = "main" }
hotone-ampero2 = { git = "ssh://git@github.com/xgodev/pedal-drivers.git", branch = "main" }
midir = "0.11.0"
clap = { version = "4.5.20", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
flate2 = "1.1.10"
ureq = "2.12"
plist = "1.7"
tempfile = "3.13.0"
