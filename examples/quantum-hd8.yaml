# A full desk on a PreSonus Quantum HD 8, plus a second bank for the computer.
#
#   cargo install --git https://github.com/xgodev/mackie-control mackie-control
#   mackie bridge examples/quantum-hd8.yaml
#
# Paths come from `quantum-hd8 dump` on YOUR interface -- channel numbers differ
# between rigs, so read them there instead of copying these.
#
# Outputs and inputs are separate groups: soloing a guitar mutes the other
# guitars and leaves the monitors alone.
surface: smc-mixer

# Always in reach, whichever bank is selected. A knob is endless, so it needs no
# takeover -- a good home for something you want from anywhere.
global:
  encoders:
    1: {driver: app, target: Spotify, label: Spotify volume}
  transport:
    play:    {driver: app, target: Spotify, command: playpause}
    stop:    {driver: app, target: Spotify, command: pause}
    forward: {driver: app, target: Spotify, command: next track}
    rewind:  {driver: app, target: Spotify, command: previous track}

banks:
  - name: HD 8
    faders:
      # --- outputs ---
      1: {driver: hd8, target: global/mainOutVolume,  label: MAIN,     group: out, mute: global/mute}
      2: {driver: hd8, target: aux/ch10/volume,       label: FRFR,     group: out, mute: aux/ch10/mute}
      3: {driver: hd8, target: global/phones1_volume, label: PHONES 1, group: out}   # no mute on the HD 8:
      4: {driver: hd8, target: global/phones2_volume, label: PHONES 2, group: out}   # M zeroes and restores
      # --- inputs ---
      5: {driver: hd8, target: line/ch1/volume,  label: GUITAR 1, group: in, mute: line/ch1/mute}
      6: {driver: hd8, target: line/ch2/volume,  label: GUITAR 2, group: in, mute: line/ch2/mute}
      # ch19/ch20 are ADAT channels here. `volume` is their level in the
      # interface's own monitor mix -- NOT the level that reaches the computer,
      # which leaves the converter before this fader. Measured 2026-09-22:
      # `trim` on an ADAT channel is accepted and ignored, and the preamp for
      # one lives on the external converter's front panel, out of reach. Do not
      # copy these two lines expecting an input gain.
      7: {driver: hd8, target: line/ch19/volume, label: GUITAR 3, group: in, mute: line/ch19/mute}
      8: {driver: hd8, target: line/ch20/volume, label: GUITAR 4, group: in, mute: line/ch20/mute}
    # No buttons block: the hd8 driver already says R = load scene, and
    # banks page with Channel < / > and the arrows.

  - name: Mac
    faders:
      1: {driver: app, target: Spotify, label: Spotify}   # the app driver brings
      2: {driver: mac, label: System volume}              # play/stop/next/previous
